name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.421

      - name: Check required README sections
        shell: pwsh
        run: |
          $requiredByFile = [ordered]@{
            'README.md' = @(
              '## 지원 작업',
              '## 작업 흐름',
              '## AI는 후보만 만든다',
              '## 작업별 상세',
              '### 객체 탐지',
              '### 세그멘테이션과 Smart Mask',
              '### 이상 탐지',
              '## 빠른 시작',
              '## 설치·요구 사항',
              '## 하나의 레시피, 여러 모델',
              '## 개발자용',
              '### 빌드 명령',
              '### 실행',
              '### 배포 검증',
              '### 환경 점검 CLI',
              '### CI',
              '## 알려진 한계',
              '## 버전',
              '### 최근 버전 이력',
              '## 라이선스'
            )
            'README.en.md' = @(
              '## Supported tasks',
              '## Workflow',
              '## AI proposes candidates',
              '## Task details',
              '### Object detection',
              '### Segmentation and Smart Mask',
              '### Anomaly detection',
              '## Quick start',
              '## Installation and requirements',
              '## One recipe, multiple models',
              '## For developers',
              '### Build Command',
              '### Running',
              '### Package verification',
              '### Environment check CLI',
              '### CI',
              '## Known Limitations',
              '## Version',
              '### Recent version history',
              '## License'
            )
          }
          foreach ($entry in $requiredByFile.GetEnumerator()) {
            $readme = Get-Content -LiteralPath $entry.Key -Raw -Encoding UTF8
            foreach ($section in $entry.Value) {
              if (-not $readme.Contains($section)) {
                throw "$($entry.Key) is missing required section: $section"
              }
            }
          }
          if (-not (Test-Path RELEASE_NOTES.md)) {
            throw "RELEASE_NOTES.md is missing"
          }

      - name: Resolve product version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid product version: $version"
          }
          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build application
        shell: pwsh
        run: dotnet build .\OpenVisionLab.LabelingStudio.csproj -c Release -p:Platform=x64 -m:1 -nr:false /p:UseSharedCompilation=false

      - name: Publish versioned self-contained release
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-win-x64.ps1 -Configuration Release

      - name: Upload versioned win-x64 release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openvisionlab-labeling-studio-${{ env.PRODUCT_VERSION }}-win-x64
          path: artifacts/publish/Release/win-x64/${{ env.PRODUCT_VERSION }}
          if-no-files-found: error
          retention-days: 1

      - name: Whitespace check
        shell: pwsh
        run: git diff --check
