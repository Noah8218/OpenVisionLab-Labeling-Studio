global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: edge-worker
    static_configs:
      - targets: ["edge-worker:9100"]
  # Requester side. With the simulator this is machine-sim; for Machine Studio,
  # replace the target with its metrics endpoint (not available yet).
  - job_name: requester
    static_configs:
      - targets: ["machine-sim:9101"]
